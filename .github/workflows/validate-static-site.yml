name: validate-static-site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f health.json
          test -f estate-site.json
          test -f vercel.json
      - name: Validate JSON
        run: |
          python -m json.tool health.json >/dev/null
          python -m json.tool estate-site.json >/dev/null
          python -m json.tool vercel.json >/dev/null
      - name: Verify federation links
        run: |
          grep -q 'https://creators-common.org' index.html
          grep -q 'https://virtualsilkroad.com' index.html
